[build-system]

requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdeg"
description = "Pvdeg is a python library that supports the calculation of degradation related parameters for photovoltaic (PV) modules."
authors = [
    { name = "Rajiv Daxini", email = "Rajiv.Daxini@nlr.gov"},
    { name = "Martin Springer", email = "Martin.Springer@nlr.gov"},
    { name = "Silvana Ovaitt", email = "Silvana.Ovaitt@nlr.gov"},
    { name = "Michael Kempe", email = "Michael.Kempe@nlr.gov"}
]
license = {text = "BSD-3"}
readme = "README.md"
requires-python = ">=3.10.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
keywords = [
    "photovoltaic",
    "solar",
    "degradation",
    "analysis",
    "performance",
    "module",
    "PV",
]
dependencies = [
    "aiohttp==3.14.3",
    "numpy>=1.19.3",
    "pvlib>=0.12.0",
    "scipy>1.6.0",
    "NREL-rex",
    "cartopy",
    "dask[dataframe]",
    "dask-jobqueue",
    "geopy",
    "h5netcdf",
    "h5py<=3.14.0",
    "jupyterlab",
    "matplotlib",
    "netCDF4",
    "notebook",
    "numba",
    "openpyxl",
    "pandas",
    "photovoltaic",
    "python-dateutil",
    "pytz",
    "seaborn",
    "tables",
    "tqdm",
    "xarray",
    "sympy",
    "zarr",
    "plotly"
]
dynamic = ["version"]

[project.optional-dependencies]
docs = [
    "readthedocs-sphinx-search>=0.3.1,<0.4",
    "sphinx>=7.2.6,<8",
    "sphinx_rtd_theme>=2.0.0,<3",
    "sphinx-gallery",
    "nbsphinx",
    "sphinx_toggleprompt",
    "pydata_sphinx_theme",
    "mistune==3.0.0",
]
test = [
    "pytest",
    "pytest-cov",
    "nbval",
    "scikit-learn",
    "NREL-PySAM",
]
books = [
    "jupyter-book<2.0",
]
sam = [
    "NREL-PySAM",
]
pvcircuit = [
    "pvcircuit @ git+https://github.com/NatLabRockies/PVcircuit@master"
]
dev = [
    "pre-commit",
    "jupytext",
]
all = [
    "pvdeg[docs,test,books,sam,dev]",
]

[project.entry-points.pvdeg]
console_scripts = "pvdeg.cli:cli"

[project.urls]
Homepage = "https://github.com/NatLabRockies/PVDegradationTools"
"Bug Tracker" = "https://github.com/NatLabRockies/PVDegradationTools/issues"
Documentation = "https://pvdegradationtools.readthedocs.io/"
"Source Code" = "https://github.com/NatLabRockies/PVDegradationTools"

[tool.setuptools.packages.find]
include = ["pvdeg"]

[tool.setuptools.package-data]
"pvdeg" = ["data/*"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = "tests"
addopts = [
    "-p no:warnings",
    "--verbose",
]
